<script>
// ==========================================================================
// Banco de pruebas: una planilla de Google de mentira
//
// Implementa lo poco de SpreadsheetApp que usa Code.gs, guardando las hojas en
// memoria como matrices. Alcanza para correr sincronizar() de verdad, con su
// leerFilas, su fusionar y su escribirFilas, sin tocar Google.
//
// La idea es poder reproducir un bug de sincronización de forma determinista y
// después demostrar que quedó arreglado.
// ==========================================================================

(function () {
  function Hoja(nombre) {
    this.nombre = nombre;
    this.filas = [];        // matriz de valores, la 0 es el encabezado
    this.maxFilas = 1000;
    this.oculta = false;
  }
  Hoja.prototype.getName = function () { return this.nombre; };
  Hoja.prototype.getMaxRows = function () { return this.maxFilas; };
  Hoja.prototype.insertRowsAfter = function (_d, cuantas) { this.maxFilas += cuantas; };
  Hoja.prototype.getLastRow = function () {
    for (var i = this.filas.length - 1; i >= 0; i--) {
      var f = this.filas[i] || [];
      for (var j = 0; j < f.length; j++) {
        if (f[j] !== "" && f[j] != null) return i + 1;
      }
    }
    return 0;
  };
  Hoja.prototype.getLastColumn = function () {
    return (this.filas[0] || []).length;
  };
  Hoja.prototype.appendRow = function (fila) { this.filas.push(fila.slice()); };
  Hoja.prototype.hideSheet = function () { this.oculta = true; };
  Hoja.prototype.setTabColor = function () { return this; };
  Hoja.prototype.setFrozenRows = function () { return this; };
  Hoja.prototype.getBandings = function () { return [{}]; };   // ya tiene, no reaplicar
  Hoja.prototype.setColumnWidth = function () { return this; };
  Hoja.prototype.hideColumns = function () { return this; };
  Hoja.prototype.getDataRange = function () {
    var self = this;
    return { getValues: function () { return self.filas.map(function (f) { return f.slice(); }); } };
  };
  Hoja.prototype.getRange = function (fila, col, nFilas, nCols) {
    var self = this;
    if (typeof fila === "string") {                    // notación A1, solo para resumen
      return rangoTonto();
    }
    nFilas = nFilas || 1;
    nCols = nCols || 1;
    if (fila + nFilas - 1 > self.maxFilas) {
      throw new Error("Those rows are out of bounds. (hoja " + self.nombre + ")");
    }
    return {
      getValues: function () {
        var out = [];
        for (var i = 0; i < nFilas; i++) {
          var origen = self.filas[fila - 1 + i] || [];
          var linea = [];
          for (var j = 0; j < nCols; j++) linea.push(origen[col - 1 + j] === undefined ? "" : origen[col - 1 + j]);
          out.push(linea);
        }
        return out;
      },
      getValue: function () { return (self.filas[fila - 1] || [])[col - 1]; },
      setValues: function (v) {
        for (var i = 0; i < v.length; i++) {
          var destino = self.filas[fila - 1 + i] || (self.filas[fila - 1 + i] = []);
          for (var j = 0; j < v[i].length; j++) destino[col - 1 + j] = v[i][j];
        }
        return this;
      },
      setValue: function (x) {
        var destino = self.filas[fila - 1] || (self.filas[fila - 1] = []);
        destino[col - 1] = x;
        return this;
      },
      clearContent: function () {
        for (var i = 0; i < nFilas; i++) {
          var destino = self.filas[fila - 1 + i];
          if (!destino) continue;
          for (var j = 0; j < nCols; j++) destino[col - 1 + j] = "";
        }
        return this;
      },
      setBackground: rangoTonto, setFontColor: rangoTonto, setFontWeight: rangoTonto,
      setFontSize: rangoTonto, setNumberFormat: rangoTonto, setDataValidation: rangoTonto,
      setHorizontalAlignment: rangoTonto, merge: rangoTonto,
      applyRowBanding: function () {
        return { setHeaderRowColor: rangoTonto, setFirstRowColor: rangoTonto, setSecondRowColor: rangoTonto };
      },
    };
    function rangoTonto() { return this; }
  };

  function Libro() { this.hojas = {}; this.orden = []; }
  Libro.prototype.getName = function () { return "Cocina Viva · Gestión (de mentira)"; };
  Libro.prototype.getUrl = function () {
    return "https://docs.google.com/spreadsheets/d/DE-MENTIRA/edit";
  };
  Libro.prototype.getSheetByName = function (n) { return this.hojas[n] || null; };
  Libro.prototype.getSheets = function () {
    var self = this;
    return this.orden.map(function (n) { return self.hojas[n]; });
  };
  Libro.prototype.insertSheet = function (n) {
    var h = new Hoja(n);
    this.hojas[n] = h;
    this.orden.push(n);
    return h;
  };
  Libro.prototype.deleteSheet = function (h) {
    delete this.hojas[h.nombre];
    this.orden = this.orden.filter(function (n) { return n !== h.nombre; });
  };
  Libro.prototype.getRange = function () { return {}; };

  var libro = new Libro();
  var propiedades = {};

  // --- lo que Code.gs espera encontrar en el ambiente de Apps Script ---
  window.SpreadsheetApp = {
    getActive: function () { return libro; },
    newDataValidation: function () {
      var v = {
        requireValueInRange: function () { return v; },
        requireValueInList: function () { return v; },
        setAllowInvalid: function () { return v; },
        build: function () { return {}; },
      };
      return v;
    },
  };
  window.PropertiesService = {
    getDocumentProperties: function () {
      return {
        getProperty: function (k) { return propiedades[k] || null; },
        setProperty: function (k, v) { propiedades[k] = v; },
        getProperties: function () { return propiedades; },
      };
    },
  };
  window.LockService = {
    getScriptLock: function () {
      return { waitLock: function () {}, releaseLock: function () {} };
    },
  };
  window.Utilities = {
    formatDate: function (d) {
      var dos = function (n) { return ("0" + n).slice(-2); };
      return d.getFullYear() + "-" + dos(d.getMonth() + 1) + "-" + dos(d.getDate());
    },
    computeDigest: function (_a, texto) {
      var h = 0, out = [];
      for (var i = 0; i < String(texto).length; i++) h = (h * 31 + String(texto).charCodeAt(i)) | 0;
      for (var j = 0; j < 32; j++) out.push((h >> (j % 24)) & 0xff);
      return out;
    },
    Charset: { UTF_8: 1 },
    DigestAlgorithm: { SHA_256: 1 },
  };
  window.Session = { getScriptTimeZone: function () { return "America/Argentina/Buenos_Aires"; } };
  window.Logger = { log: function () {} };
  window.ContentService = {
    createTextOutput: function (t) { return { texto: t, setMimeType: function () { return this; } }; },
    MimeType: { JSON: 1 },
  };

  window.__libro = libro;
})();

</script>
<!-- 2. El servicio REAL, tal cual está en el repositorio -->
<script>
/* ==========================================================================
   Cocina Viva · servicio de la planilla

   Script VINCULADO al libro "Cocina Viva · Gestión" (se abre desde la planilla
   misma: Extensiones → Apps Script). Por eso acá no hay ningún identificador:
   SpreadsheetApp.getActive() ya es el libro correcto. Es la diferencia con
   Semillas, donde el script era suelto y había que cargarle los ids a mano;
   la mitad de los problemas de instalación venían de ahí.

   HOJAS QUE ADMINISTRA
     productos     código, producto, presentación, precios, activo
     clientes      nombre, localidad, tipo, medio de pago habitual, activo
     ingresos      una fila por PRODUCTO vendido (varias por venta)
     egresos       una fila por gasto
     movimientos   el libro mayor de mercadería: de dónde salió y a dónde fue
     listas        los desplegables (medios de pago, rubros)
     resumen       fórmulas vivas, para mirar desde la planilla
     invitaciones  códigos de acceso                  (oculta)
     dispositivos  teléfonos habilitados              (oculta)
     borrados      bajas propagadas entre teléfonos   (oculta)

   Cualquier OTRA hoja que agreguen a mano no se toca nunca.

   POR QUÉ EL STOCK NO SE GUARDA EN NINGUNA CELDA
   La hoja "movimientos" es la única verdad sobre la mercadería. Cada fila dice
   una cantidad, de dónde salió y a dónde fue. El stock del depósito y el de
   cada local se CALCULAN sumando esas filas. Así no existe el caso de que el
   número guardado y los movimientos no coincidan, y siempre se puede
   reconstruir de dónde salió cada unidad.

   En la planilla vieja esto estaba mezclado: dejar mercadería en consignación
   se anotaba como un ingreso con medio de pago "Consignación", que descontaba
   stock y al mismo tiempo registraba como cobrada plata que todavía no estaba.
   Acá son dos cosas distintas: la ENTREGA mueve mercadería y no toca la plata;
   la LIQUIDACIÓN es la que cobra.

   LAS FUNCIONES QUE SE EJECUTAN A MANO, DESDE EL EDITOR

     prepararLibro()      arma las hojas y carga productos, clientes y el stock
                          inicial. Correrla dos veces no rompe ni duplica nada.
     crearInvitaciones()  saca códigos de acceso nuevos.
     reaplicarFormato()   reaplica formato y desplegables a un libro ya armado,
                          cuando este código cambió. No toca los datos.
     revisar()            diagnóstico. No toca nada: cuenta qué encontró.

   El procedimiento completo de instalación, en orden y con los pasos que hay
   que hacer fuera del editor, está en INSTALACION.md del repositorio. NO se
   repite acá a propósito: cuando la lista estaba en los dos lados, los números
   se corrieron y el paso 4 de un archivo era el 5 del otro.

   https://github.com/MartinTrigo/cocina-viva/blob/main/INSTALACION.md
   ========================================================================== */

// Versión del protocolo. La app rechaza una respuesta que no la traiga o que
// traiga otra: así una implementación vieja que haya quedado publicada no
// puede pisar los datos del teléfono con un esquema que ya no existe.
var API = 4;

// Ubicaciones reservadas del libro mayor. En mayúscula y sin acentos a
// propósito: los locales se escriben como los nombraron ellas ("humus",
// "el gaita"), así que nunca se van a confundir con estas.
var DEPOSITO = 'DEPOSITO';
var PRODUCCION = 'PRODUCCION';
var VENDIDO = 'VENDIDO';
var MERMA = 'MERMA';

var COLUMNAS = {
  productos:   ['cod', 'producto', 'presentacion', 'costo', 'pmayor', 'pminor', 'activo', 'mod'],
  clientes:    ['nombre', 'localidad', 'tipo', 'medio_pago', 'activo', 'mod'],
  ingresos:    ['id', 'venta', 'fecha', 'cliente', 'lista', 'medio_pago', 'pagado',
                'cod', 'cantidad', 'precio', 'subtotal', 'obs', 'mod'],
  egresos:     ['id', 'fecha', 'rubro', 'detalle', 'persona', 'cantidad', 'monto',
                'medio_pago', 'obs', 'mod'],
  // Quién trabaja y a cuánto se le paga la hora. Se identifican por el nombre,
  // como los clientes: son pocas y las escriben ellas.
  personas:    ['nombre', 'cargo', 'precio_hora', 'activo', 'mod'],
  // Cada rato de trabajo, con su fecha y su actividad.
  horas:       ['id', 'fecha', 'persona', 'actividad', 'horas', 'obs', 'mod'],
  movimientos: ['id', 'fecha', 'tipo', 'cod', 'cantidad', 'desde', 'hacia', 'ref', 'obs', 'mod'],
  borrados:    ['id', 'mod']
};

var ENCABEZADOS = {
  productos:   ['código', 'producto', 'presentación', 'costo', 'precio mayor', 'precio minorista', 'activo', 'mod'],
  clientes:    ['nombre', 'localidad', 'tipo', 'medio de pago habitual', 'activo', 'mod'],
  ingresos:    ['id', 'venta', 'fecha', 'cliente', 'lista', 'medio de pago', 'pagado',
                'código', 'cantidad', 'precio', 'subtotal', 'observaciones', 'mod'],
  egresos:     ['id', 'fecha', 'rubro', 'detalle', 'persona', 'cantidad', 'monto',
                'medio de pago', 'observaciones', 'mod'],
  personas:    ['nombre', 'cargo', 'precio por hora', 'activo', 'mod'],
  horas:       ['id', 'fecha', 'persona', 'actividad', 'horas', 'observaciones', 'mod'],
  movimientos: ['id', 'fecha', 'tipo', 'código', 'cantidad', 'desde', 'hacia', 'referencia',
                'observaciones', 'mod'],
  borrados:     ['id', 'mod'],
  listas:       ['medios de pago', 'rubros de egreso'],
  invitaciones: ['código', 'para quién', 'estado', 'creada', 'usada el', 'dispositivo'],
  dispositivos: ['dispositivo', 'persona', 'activo', 'alta', 'última actividad', 'envíos', 'huella']
};

// Los tipos de movimiento y qué hacen con la mercadería. El "desde" y el
// "hacia" los pone la app; se listan acá para que la hoja se entienda
// mirándola sola.
//
//   produccion    PRODUCCION → DEPOSITO    envasaron y entró al depósito
//   venta         DEPOSITO   → VENDIDO     venta con cobro, sale del depósito
//   entrega       DEPOSITO   → humus       se dejó en consignación, sin cobrar
//   liquidacion   humus      → VENDIDO     el local vendió y pagó
//   devolucion    humus      → DEPOSITO    volvió sin venderse
//   ajuste        según el conteo real
//   merma         DEPOSITO   → MERMA       rotura, vencimiento, consumo propio
var TIPOS = ['produccion', 'venta', 'entrega', 'liquidacion', 'devolucion', 'ajuste', 'merma'];

// En qué se va el tiempo. La misma lista que usa la app, repetida acá para que
// la planilla ofrezca el desplegable a quien cargue una hora a mano.
var ACTIVIDADES = ['elaboración', 'envasado', 'administración', 'reparto',
                   'comercialización', 'comunicación', 'mantenimiento'];

var COLOR = {
  bordo: '#8c0730', bordoSuave: '#f6e7ec',
  verde: '#4a6b3a', verdeSuave: '#eaf0e5',
  tierra: '#a9722f', tierraSuave: '#f7eddd',
  gris: '#6b6560', crema: '#faf6f0', blanco: '#ffffff'
};

/* ================= Entradas del servicio ================= */

// Todo va envuelto: si algo falla, Apps Script devuelve una página HTML de
// error que no le dice nada a nadie. Así al menos vuelve el motivo en JSON.
function doGet(e) {
  try {
    var p = (e && e.parameter) || {};

    // Lo único abierto sin credencial: canjear el código de invitación.
    if (p.canjear) {
      return json(canjearInvitacion(p.canjear, p.persona || '', p.dispositivo || ''));
    }
    return json({ ok: true, api: API, servicio: 'Cocina Viva', hora: new Date().toISOString() });
  } catch (err) {
    return json({ ok: false, error: String(err), donde: 'doGet' });
  }
}

function doPost(e) {
  var candado = LockService.getScriptLock();
  candado.waitLock(25000);
  try {
    var pedido = JSON.parse(e.postData.contents);

    // Nada se lee ni se escribe sin credencial. La dirección del servicio está
    // en el código público de la app: sin esto, cualquiera que la encontrara
    // podría leer las ventas del emprendimiento o inventar filas.
    var permiso = permitido(pedido.credencial);
    if (!permiso.ok) return json(permiso);

    asegurarEsquema();
    var estado = sincronizar(pedido);
    marcarActividad(permiso.fila, estado.guardados);
    return json(estado);
  } catch (err) {
    return json({ ok: false, error: String(err), donde: 'doPost' });
  } finally {
    candado.releaseLock();
  }
}

/* ================= Sincronización ================= */

// Un solo viaje hace las dos cosas: sube lo que el teléfono tenga pendiente y
// baja el estado completo. La app se queda con lo que vuelve, así que después
// de sincronizar todos los teléfonos muestran lo mismo.
function sincronizar(pedido) {
  var borrados = {};
  leerBorrados().forEach(function (b) { borrados[b.id] = b; });
  (pedido.borrados || []).forEach(function (b) { borrados[b.id] = b; });

  var guardados = 0;
  var resultado = { ok: true, api: API };

  ['ingresos', 'egresos', 'movimientos', 'horas'].forEach(function (nombre) {
    var entrantes = pedido[nombre] || [];
    guardados += entrantes.length;
    var fusionadas = fusionar(leerFilas(nombre), entrantes, borrados);
    escribirFilas(nombre, fusionadas);
    resultado[nombre] = fusionadas;
  });

  // Productos y clientes se identifican por su código o su nombre, no por un
  // id: son catálogos cortos que ellas también editan desde la planilla.
  [['productos', 'cod'], ['clientes', 'nombre'], ['personas', 'nombre']].forEach(function (par) {
    var entrantes = pedido[par[0]] || [];
    guardados += entrantes.length;
    var fusionadas = fusionarPorClave(leerFilas(par[0]), entrantes, par[1], borrados);
    escribirFilas(par[0], fusionadas);
    resultado[par[0]] = fusionadas;
  });

  escribirBorrados(borrados);
  resultado.borrados = Object.keys(borrados).map(function (id) {
    return { id: id, mod: borrados[id].mod };
  });
  resultado.listas = leerListas();
  resultado.libro = SpreadsheetApp.getActive().getUrl();
  resultado.guardados = guardados;
  return resultado;
}

// Gana la versión con el "mod" más alto. Es la regla más simple que funciona
// con dos o tres personas cargando desde teléfonos distintos, y la misma que
// venimos usando en bioma-mov.
function fusionar(remotas, locales, borrados) {
  var porId = {};
  remotas.concat(locales).forEach(function (f) {
    if (!f || !f.id || borrados[f.id]) return;
    var previa = porId[f.id];
    if (!previa || (Number(f.mod) || 0) > (Number(previa.mod) || 0)) porId[f.id] = f;
  });
  return Object.keys(porId).map(function (id) { return porId[id]; })
    .sort(function (a, b) { return String(a.fecha).localeCompare(String(b.fecha)); });
}

// Productos y clientes se borran por su clave, no por un id. La lápida gana
// mientras sea igual o más nueva que la fila: si después de dar de baja a un
// cliente lo vuelven a cargar con el mismo nombre, la fila nueva es más nueva
// que la lápida y gana ella. Si la lápida ganara siempre, un nombre borrado una
// vez no se podría volver a usar nunca más, y nadie entendería por qué.
//
// Con los ingresos y los movimientos es al revés —ahí la lápida gana siempre—
// porque sus ids son irrepetibles: nunca hay que revivir uno, y así la baja
// aguanta aunque a la fila le falte el "mod".
function fusionarPorClave(remotas, locales, clave, borrados) {
  var porClave = {};
  remotas.concat(locales).forEach(function (f) {
    var k = String((f && f[clave]) || '').trim();
    if (!k) return;
    var lapida = borrados && borrados[k];
    if (lapida && (Number(lapida.mod) || 0) >= (Number(f.mod) || 0)) return;
    var previa = porClave[k];
    if (!previa || (Number(f.mod) || 0) > (Number(previa.mod) || 0)) porClave[k] = f;
  });
  return Object.keys(porClave).sort().map(function (k) { return porClave[k]; });
}

/* ================= Lectura ================= */

// Lee una hoja tolerando filas escritas a mano: si falta el id lo inventa, si
// la fecha vino "7/8/2026" la normaliza, si el monto vino "$ 1.234,50" lo
// convierte a número. Que puedan agregar una fila desde la planilla y que la
// app la levante igual no es un extra: es la razón de usar una planilla.
function leerFilas(nombre) {
  var h = hoja(nombre);
  var valores = h.getDataRange().getValues();
  var cols = COLUMNAS[nombre];
  var filas = [];
  var contador = 0;

  for (var i = 1; i < valores.length; i++) {
    var v = valores[i];
    var vacia = true;
    for (var k = 0; k < cols.length; k++) {
      if (v[k] !== '' && v[k] != null) { vacia = false; break; }
    }
    if (vacia) continue;

    var o = {};
    for (var j = 0; j < cols.length; j++) o[cols[j]] = v[j];
    o.mod = Number(o.mod) || Date.now();

    if (nombre === 'productos') {
      o.cod = String(o.cod || '').trim().toUpperCase();
      if (!o.cod) continue;
      o.producto = String(o.producto || '').trim();
      o.presentacion = String(o.presentacion || '').trim();
      o.costo = numero(o.costo);
      o.pmayor = numero(o.pmayor);
      o.pminor = numero(o.pminor);
      o.activo = siNo(o.activo, true);

    } else if (nombre === 'clientes') {
      o.nombre = String(o.nombre || '').trim();
      if (!o.nombre) continue;
      o.localidad = String(o.localidad || '').trim();
      o.tipo = String(o.tipo || '').trim().toLowerCase().indexOf('consig') === 0
        ? 'consignación' : 'compra';
      o.medio_pago = String(o.medio_pago || '').trim();
      o.activo = siNo(o.activo, true);

    } else {
      o.id = String(o.id || '').trim() || ('man-' + Date.now().toString(36) + '-' + (contador++));
      // Ojo: acá antes decía «|| fechaIso(new Date())». Una fila sin fecha salía
      // con la de hoy, que es peor que vacía porque parece un dato bueno. Así
      // fue como 140 ventas de julio y agosto terminaron diciendo 07/09/2026.
      o.fecha = fechaIso(o.fecha);
    }

    if (nombre === 'ingresos') {
      o.venta = String(o.venta || '').trim() || o.id;
      o.pagado = siNo(o.pagado, true);
      o.cliente = String(o.cliente || '').trim();
      o.lista = String(o.lista || '').trim().toLowerCase().indexOf('min') === 0
        ? 'minorista' : 'mayorista';
      o.medio_pago = String(o.medio_pago || '').trim();
      o.cod = String(o.cod || '').trim().toUpperCase();
      o.cantidad = numero(o.cantidad);
      o.precio = numero(o.precio);
      // Si la fila se cargó a mano sin subtotal, se calcula; si lo pusieron, se
      // respeta: puede haber un redondeo o una bonificación.
      o.subtotal = numero(o.subtotal) || (o.cantidad * o.precio);
      o.obs = String(o.obs || '');
      if (!o.cantidad && !o.subtotal) continue;

    } else if (nombre === 'personas') {
      o.nombre = String(o.nombre || '').trim();
      if (!o.nombre) continue;
      o.cargo = String(o.cargo || '').trim();
      o.precio_hora = numero(o.precio_hora);
      o.activo = siNo(o.activo, true);

    } else if (nombre === 'horas') {
      o.persona = String(o.persona || '').trim();
      o.actividad = String(o.actividad || '').trim();
      o.horas = numero(o.horas);
      o.obs = String(o.obs || '');
      if (!o.persona || !o.horas) continue;

    } else if (nombre === 'egresos') {
      o.rubro = String(o.rubro || '').trim() || 'Otros Gastos';
      o.detalle = String(o.detalle || '');
      // Solo la llevan los honorarios: dice a quién se le pagó. Es lo que
      // permite saber cuánto se le debe a cada una sin adivinarlo del detalle.
      o.persona = String(o.persona || '').trim();
      // La cantidad de un egreso es texto a propósito: en la planilla vieja hay
      // "5,4", "9,5 l", "2 k" y "7 turnos". Obligarla a número perdería el dato.
      o.cantidad = String(o.cantidad == null ? '' : o.cantidad);
      o.monto = numero(o.monto);
      o.medio_pago = String(o.medio_pago || '').trim();
      o.obs = String(o.obs || '');
      if (!o.monto) continue;

    } else if (nombre === 'movimientos') {
      o.tipo = String(o.tipo || '').trim().toLowerCase();
      if (TIPOS.indexOf(o.tipo) < 0) o.tipo = 'ajuste';
      o.cod = String(o.cod || '').trim().toUpperCase();
      o.cantidad = numero(o.cantidad);
      o.desde = String(o.desde || '').trim();
      o.hacia = String(o.hacia || '').trim();
      o.ref = String(o.ref || '');
      o.obs = String(o.obs || '');
      if (!o.cod || !o.cantidad) continue;
    }

    filas.push(o);
  }

  // Una venta se guarda en varios renglones que comparten la fecha. Si a alguno
  // le falta, se la presta un hermano; inventarla no.
  if (nombre === 'ingresos') {
    var deLaVenta = {};
    filas.forEach(function (f) {
      if (f.fecha && !deLaVenta[f.venta]) deLaVenta[f.venta] = f.fecha;
    });
    filas.forEach(function (f) { if (!f.fecha) f.fecha = deLaVenta[f.venta] || ''; });
  }
  return filas;
}

function leerBorrados() {
  var v = hoja('borrados').getDataRange().getValues();

  for (var i = 1; i < v.length; i++) {

    out.push({ id: String(v[i][0]), mod: Number(v[i][1]) || 0 });
  }
  return out;
}

function leerListas() {
  var v = hoja('listas').getDataRange().getValues();
  var listas = { medios_pago: [], rubros: [] };
  for (var i = 1; i < v.length; i++) {

    if (r && listas.rubros.indexOf(r) < 0) listas.rubros.push(r);
  }
  return listas;
}

/* ================= Escritura ================= */

// Un texto que empieza con "=" o con "+" NO se guarda como texto: la planilla
// lo toma como fórmula. Una observación como «=2 frascos rotos» queda en
// #NAME?, y una fórmula puesta a propósito podría leer o sacar datos del libro
// entero. La comilla simple adelante le dice a la planilla «esto es texto»: no
// se ve en la celda y al leerla de vuelta no viene, así que el dato va y
// vuelve igual.
//
// Solo aplica a los textos. Los números y las fechas se escriben como son.
function comoTexto(v) {
  if (v == null) return '';
  if (typeof v !== 'string') return v;
  return /^[=+]/.test(v) ? "'" + v : v;
}

function escribirFilas(nombre, objetos) {
  var h = hoja(nombre);
  var cols = COLUMNAS[nombre];
  var ultima = h.getLastRow();

  // Una fecha que ya está escrita no se pisa con un vacío. El 7 de septiembre
  // la columna de fechas de «ingresos» quedó en blanco de golpe —138 filas de
  // 143— y la escritura siguiente dejó el blanco firme. Ahora, si el renglón
  // que entra viene sin fecha, se queda con la que tenía la planilla.
  var fechaVieja = {};
  var iId = cols.indexOf('id'), iFecha = cols.indexOf('fecha');
  if (iId >= 0 && iFecha >= 0 && ultima > 1) {
    h.getRange(2, 1, ultima - 1, cols.length).getValues().forEach(function (f) {
      var id = String(f[iId] || '').trim();
      var d = fechaIso(f[iFecha]);
      if (id && d) fechaVieja[id] = d;
    });
  }

  if (ultima > 1) h.getRange(2, 1, ultima - 1, cols.length).clearContent();
  if (!objetos.length) return;

  var filas = objetos.map(function (o) {
    return cols.map(function (c) {
      var v = o[c];
      if (c === 'fecha') return aFecha(v || fechaVieja[o.id] || '');
      // «pagado» sale sí/no como «activo»: la celda tiene ese desplegable y
      // venía escribiendo TRUE, que la validación marca como valor de afuera.
      if (c === 'activo' || c === 'pagado') return v === false ? 'no' : 'sí';
      return comoTexto(v);
    });
  });
  asegurarFilas(h, filas.length + 1);
  h.getRange(2, 1, filas.length, cols.length).setValues(filas);
}

function escribirBorrados(borrados) {
  var h = hoja('borrados');
  var ultima = h.getLastRow();
  if (ultima > 1) h.getRange(2, 1, ultima - 1, 2).clearContent();
  var ids = Object.keys(borrados);
  if (!ids.length) return;
  h.getRange(2, 1, ids.length, 2).setValues(ids.map(function (id) {
    return [id, borrados[id].mod];
  }));
}

/* ================= Normalización ================= */

function dos(n) { return ('0' + n).slice(-2); }

// Acepta lo que salga: el objeto Date de la planilla, "7/8/2026", "2026-08-07"
// y también "7/8" sin año, que en la planilla vieja aparece bastante.
function fechaIso(v) {
  if (v instanceof Date && !isNaN(v)) {
    return Utilities.formatDate(v, Session.getScriptTimeZone(), 'yyyy-MM-dd');
  }
  var s = String(v || '').trim();
  if (!s) return '';
  var m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
  if (m) return m[3] + '-' + dos(m[2]) + '-' + dos(m[1]);
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return m[1] + '-' + dos(m[2]) + '-' + dos(m[3]);
  m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})$/);
  if (m) return new Date().getFullYear() + '-' + dos(m[2]) + '-' + dos(m[1]);
  return '';
}

function aFecha(s) {
  var m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return s || '';
  return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
}

// "$ 12.300" y "12,5" salen bien los dos: el punto separa miles y la coma es
// el decimal, que es como se escribe acá.
function numero(v) {
  if (typeof v === 'number') return v;
  var s = String(v == null ? '' : v).replace(/[^\d,.\-]/g, '');
  if (!s) return 0;
  if (s.indexOf(',') > -1 && s.lastIndexOf(',') > s.lastIndexOf('.')) {
    s = s.replace(/\./g, '').replace(',', '.');
  } else if (/^\-?\d{1,3}(\.\d{3})+$/.test(s)) {
    s = s.replace(/\./g, '');
  } else {
    s = s.replace(/,/g, '');
  }
  return Number(s) || 0;
}

// Cualquier cosa que no diga que no, es que sí. Que tachen la celda con una
// "x" o la dejen vacía no tiene que dar de baja un producto sin querer.
function siNo(v, porDefecto) {
  var s = String(v == null ? '' : v).trim().toLowerCase();
  if (!s) return porDefecto;
  return !(s === 'no' || s === 'n' || s === 'false' || s === '0' || s === 'baja');
}

function json(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj))
    .setMimeType(ContentService.MimeType.JSON);
}

/* ==========================================================================
   ACCESO

   La dirección del servicio va escrita en docs/js/sincro.js, que es público.
   Sin nada más, cualquiera que la encontrara podría leer las ventas del
   emprendimiento o inventar filas. En MonAgric se comprobó ejecutándolo: no
   era teoría.

   Por eso cada teléfono canjea UNA VEZ un código y recibe a cambio una
   credencial larga y al azar que queda guardada en ese aparato. Del lado de
   la planilla se guarda solo la huella SHA-256: alcanza para comprobarla,
   pero no permite reconstruirla.

   Si un teléfono se pierde, se escribe "no" en la columna "activo" de su fila
   en la hoja "dispositivos" y deja de poder entrar, sin afectar a nadie más.
   ========================================================================== */

// De la credencial sale siempre la misma huella, pero de la huella no se
// puede volver a la credencial.
function huella(texto) {
  var bytes = Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256,
                                      String(texto), Utilities.Charset.UTF_8);
  return bytes.map(function (b) {
    return ('0' + (b < 0 ? b + 256 : b).toString(16)).slice(-2);
  }).join('');
}

// Sin I, O, 0 ni 1: se confunden al dictarlos por teléfono o al copiarlos de
// un papel.
function alAzar(largo) {
  var letras = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  var s = '';
  for (var i = 0; i < largo; i++) {
    s += letras.charAt(Math.floor(Math.random() * letras.length));
  }
  return s;
}

// Se ejecuta A MANO desde el editor. No se expone como entrada del servicio:
// si cualquiera pudiera pedir invitaciones, no habría control de acceso.
function crearInvitaciones() {
  var cuantas = 4;            // ← alcanzan para las dos, más dos de repuesto
  asegurarEsquema();
  var h = hoja('invitaciones');
  var salida = [];
  for (var i = 0; i < cuantas; i++) {
    var codigo = alAzar(4) + '-' + alAzar(4);
    h.appendRow([codigo, '', 'Nueva', new Date(), '', '']);
    salida.push(codigo);
  }
  // El aviso de dónde están importa: la hoja "invitaciones" se crea OCULTA, y
  // sin decirlo parece que la función no hubiera hecho nada.
  var texto = 'Se crearon ' + cuantas + ' códigos:\n\n' + salida.join('\n')
    + '\n\nQuedan en la hoja «invitaciones», que está OCULTA a propósito. Para '
    + 'verla: clic derecho sobre cualquier pestaña de abajo → «Ver hojas '
    + 'ocultas» → invitaciones.\n\nAnotá ahí, en la columna «para quién», a '
    + 'quién le tocó cada uno. Cada código sirve una sola vez y en un solo '
    + 'teléfono.';
  Logger.log(texto);
  return texto;
}

// Canjea el código por una credencial. El código queda usado y no sirve más.
function canjearInvitacion(codigo, persona, dispositivo) {
  codigo = String(codigo || '').trim().toUpperCase();
  if (!codigo) return rechazo('Falta el código.');
  if (!dispositivo) return rechazo('Falta el identificador del teléfono.');

  // Sin el candado, dos personas canjeando el mismo código en el mismo momento
  // podrían quedar las dos adentro.
  var candado = LockService.getScriptLock();
  candado.waitLock(20000);
  try {
    asegurarEsquema();
    var h = hoja('invitaciones');
    if (h.getLastRow() < 2) return rechazo('Ese código no existe.');

    var ancho = ENCABEZADOS.invitaciones.length;
    var filas = h.getRange(2, 1, h.getLastRow() - 1, ancho).getValues();

    for (var i = 0; i < filas.length; i++) {
      if (String(filas[i][0]).trim().toUpperCase() !== codigo) continue;

      // Solo sirve un código que siga diciendo "Nueva". Vale al revés que lo
      // obvio a propósito: cualquier cosa que no sea "Nueva" lo inutiliza, así
      // tacharlo escribiendo "anulado" en la celda alcanza para darlo de baja.
      var estado = String(filas[i][2] || '').trim().toLowerCase();
      if (estado === 'usado') return rechazo('Ese código ya se usó en otro teléfono.');
      if (estado !== 'nueva') return rechazo('Ese código fue dado de baja. Pedí otro.');

      var credencial = alAzar(8) + '-' + alAzar(8) + '-' + alAzar(8);
      var quien = persona || String(filas[i][1] || '');
      hoja('dispositivos').appendRow([dispositivo, quien, 'sí', new Date(), new Date(), 0,
                                      huella(credencial)]);
      h.getRange(i + 2, 3, 1, 4).setValues([['Usado', filas[i][3], new Date(), dispositivo]]);
      return { ok: true, api: API, credencial: credencial, persona: quien };
    }
    return rechazo('Ese código no existe.');
  } finally {
    candado.releaseLock();
  }
}

function permitido(credencial) {
  if (!credencial) return rechazo('Este teléfono todavía no tiene acceso.');

  var h = SpreadsheetApp.getActive().getSheetByName('dispositivos');
  if (!h || h.getLastRow() < 2) return rechazo('Este teléfono todavía no tiene acceso.');

  var buscada = huella(credencial);
  var ancho = ENCABEZADOS.dispositivos.length;
  var filas = h.getRange(2, 1, h.getLastRow() - 1, ancho).getValues();

  for (var i = 0; i < filas.length; i++) {
    if (String(filas[i][6]) !== buscada) continue;
    if (!siNo(filas[i][2], true)) {
      return rechazo('Este teléfono fue dado de baja. Pedí un código nuevo.');
    }
    return { ok: true, fila: i + 2, persona: String(filas[i][1] || '') };
  }
  return rechazo('Credencial desconocida. Pedí un código nuevo.');
}

// Deja constancia de que ese teléfono estuvo activo y cuánto subió. Si falla,
// se ignora: no se va a perder una venta por no poder anotar la visita.
function marcarActividad(fila, cuantos) {
  if (!fila) return;
  try {
    var h = SpreadsheetApp.getActive().getSheetByName('dispositivos');
    h.getRange(fila, 5).setValue(new Date());
    if (cuantos) {
      var previos = Number(h.getRange(fila, 6).getValue()) || 0;
      h.getRange(fila, 6).setValue(previos + cuantos);
    }
  } catch (err) { /* a propósito */ }
}

function rechazo(motivo) {
  return { ok: false, api: API, sin_permiso: true, error: motivo };
}

/* --------------------------------------------------------------------------
   LA COLUMNA DE COSTO EN LA HOJA DE PRODUCTOS

   La hoja se creó sin costo. Agregarlo en el medio corre todo lo que está a la
   derecha, y como la sincronización lee y escribe POR POSICIÓN, una hoja en el
   orden viejo leída con el orden nuevo devuelve los datos cambiados de lugar:
   el precio mayorista pasaría a leerse como costo, y así en cascada.

   Por eso esto corre desde asegurarEsquema(), que doPost llama ANTES de
   sincronizar. No hay ventana en la que alguien pueda sincronizar contra una
   hoja a medio migrar.

   Se detecta sola y no hace nada si ya está hecha, así que correrla mil veces
   es gratis.
   -------------------------------------------------------------------------- */

// El orden de columnas que tenía cada hoja antes de la versión de ahora. Es lo
// único que hace falta para migrarla: se lee con el orden con el que se
// escribió y se vuelve a escribir con el de hoy, mapeando POR NOMBRE.
var COLUMNAS_ANTERIORES = {
  productos: ['cod', 'producto', 'presentacion', 'pmayor', 'pminor', 'activo', 'mod'],
  ingresos:  ['id', 'venta', 'fecha', 'cliente', 'lista', 'medio_pago', 'cod',
              'cantidad', 'precio', 'subtotal', 'obs', 'mod'],
  egresos:   ['id', 'fecha', 'rubro', 'detalle', 'cantidad', 'monto', 'medio_pago',
              'obs', 'mod'],
};

function migrarHoja(nombre) {
  var viejas = COLUMNAS_ANTERIORES[nombre];
  var nuevas = COLUMNAS[nombre];
  if (!viejas || viejas.length >= nuevas.length) return '';

  // La primera posición donde los dos órdenes dejan de coincidir es, por
  // construcción, donde entra la columna nueva. Si el encabezado ya dice ahí lo
  // que dice el orden de hoy, la hoja está migrada.
  var corte = 0;
  while (corte < viejas.length && viejas[corte] === nuevas[corte]) corte++;

  var h = hoja(nombre);
  var ancho = Math.max(h.getLastColumn(), nuevas.length);
  var encabezado = h.getRange(1, 1, 1, ancho).getValues()[0];
  var esperado = String(ENCABEZADOS[nombre][corte]).trim().toLowerCase();
  if (String(encabezado[corte] || '').trim().toLowerCase() === esperado) return '';

  var ultima = h.getLastRow();
  var crudas = ultima > 1 ? h.getRange(2, 1, ultima - 1, viejas.length).getValues() : [];

  var salida = [];
  crudas.forEach(function (f) {
    var o = {}, tieneAlgo = false;
    for (var j = 0; j < viejas.length; j++) {
      o[viejas[j]] = f[j];
      if (f[j] !== '' && f[j] != null) tieneAlgo = true;
    }
    if (!tieneAlgo) return;
    // Lo que no existía antes queda vacío, y cada dato viejo cae en su lugar
    // nuevo por el nombre de la columna, nunca por el número.
    salida.push(nuevas.map(function (c) {
      return Object.prototype.hasOwnProperty.call(o, c) ? o[c] : '';
    }));
  });

  var n = nuevas.length;
  asegurarFilas(h, Math.max(salida.length + 1, FILAS_CON_FORMATO));
  h.getRange(1, 1, 1, n).setValues([ENCABEZADOS[nombre]]);
  if (ultima > 1) h.getRange(2, 1, ultima - 1, n).clearContent();
  if (salida.length) h.getRange(2, 1, salida.length, n).setValues(salida);

  reaplicarFormato();
  // Cualquier columna nueva corre las letras, y el resumen apunta por letra.
  arreglarFormulasDelResumen();

  return 'Hoja «' + nombre + '» migrada: entró la columna «'
       + ENCABEZADOS[nombre][corte] + '» (' + salida.length + ' filas).';
}

// La hoja resumen tenía escrita la letra D para el precio mayorista. Con la
// columna nueva, la D pasó a ser el costo: la tabla habría mostrado el stock
// valuado al costo sin dar ningún error.
function arreglarPrecioDelResumen() {
  var ss = SpreadsheetApp.getActive();
  var h = ss.getSheetByName('resumen');
  if (!h) return;
  var letra = letraDe('productos', 'pmayor');
  var filas = [];
  for (var i = 0; i < 60; i++) {
    var p = i + 2, f = i + 11;
    filas.push(['=IF($A' + f + '="";"";productos!' + letra + p + ')']);
  }
  h.getRange(11, 5, 60, 1).setValues(filas);
}

// Lo que corre también en cada sincronización: barato si ya está todo hecho.
function asegurarEsquema() {
  var props = PropertiesService.getDocumentProperties();
  var hechas = [];

  // Antes que nada, y en cada sincronización. Es barato —mira una celda— y
  // tiene que correr SÍ O SÍ antes de leer: si alguien sincroniza con la hoja
  // en el orden viejo, las columnas se leen corridas y se escriben corridas.
  ['productos', 'ingresos', 'egresos'].forEach(function (n) {
    var migrada = migrarHoja(n);
    if (migrada) hechas.push(migrada);
  });

  ['productos', 'clientes', 'personas', 'ingresos', 'egresos', 'horas', 'movimientos',
   'listas', 'invitaciones', 'dispositivos', 'borrados'].forEach(function (n) { hoja(n); });

  if (props.getProperty('esquema') !== 'v1') {
    darFormato();
    hechas.push('Hojas creadas y con formato.');

    if (hoja('listas').getLastRow() < 2) {
      var n = Math.max(SEMILLA_MEDIOS.length, SEMILLA_RUBROS.length);
      var filas = [];
      for (var i = 0; i < n; i++) {
        filas.push([SEMILLA_MEDIOS[i] || '', SEMILLA_RUBROS[i] || '']);
      }
      hoja('listas').getRange(2, 1, n, 2).setValues(filas);
      hechas.push('Listas de medios de pago y rubros cargadas.');
    }

    // Cada carga mira SU propia hoja, no la de al lado. Si las tres colgaran
    // de una sola condición y la ejecución se cortara en el medio —Apps Script
    // corta a los seis minutos, y una autorización a medias también corta—, al
    // volver a ejecutar la condición ya sería falsa y lo que faltaba no se
    // cargaría nunca.
    if (hoja('productos').getLastRow() < 2) hechas.push(cargarProductos());
    if (hoja('clientes').getLastRow() < 2) hechas.push(cargarClientes());
    if (hoja('movimientos').getLastRow() < 2) hechas.push(cargarStockInicial());

    crearResumen();
    hechas.push('Hoja resumen creada.');
    ['invitaciones', 'dispositivos', 'borrados'].forEach(function (n) { hoja(n).hideSheet(); });
    limpiarHojaSobrante();
    props.setProperty('esquema', 'v1');
  }
  return hechas.length ? hechas : ['Ya estaba todo listo, no hizo falta cambiar nada.'];
}

function cargarProductos() {
  var ahora = Date.now();
  var filas = SEMILLA_PRODUCTOS.map(function (p) {
    // El costo va vacío: no está en la planilla vieja y no se inventa.
    return [p[0], p[1], p[2], '', p[3], p[4], 'sí', ahora];
  });
  hoja('productos').getRange(2, 1, filas.length, COLUMNAS.productos.length).setValues(filas);
  return 'Cargados ' + filas.length + ' productos.';
}

function cargarClientes() {
  var ahora = Date.now();
  var filas = SEMILLA_CLIENTES.map(function (c) {
    return [c[0], c[1], c[2], '', 'sí', ahora];
  });
  hoja('clientes').getRange(2, 1, filas.length, 6).setValues(filas);
  return 'Cargados ' + filas.length + ' clientes.';
}

// El stock inicial entra como movimientos de verdad, uno por producto, en vez
// de como un número suelto en una celda. Así el depósito queda cuadrado desde
// el primer día por el mismo camino que todo lo que venga después, y se ve de
// dónde salió: dice "ajuste" con la fecha del conteo.
function cargarStockInicial() {
  var ahora = Date.now();
  var filas = [];
  SEMILLA_PRODUCTOS.forEach(function (p, i) {
    if (!p[5]) return;
    filas.push(['ini-' + p[0], aFecha(FECHA_STOCK_INICIAL), 'ajuste', p[0], p[5],
                '', DEPOSITO, 'conteo inicial',
                'Stock contado el ' + FECHA_STOCK_INICIAL, ahora + i]);
  });
  if (!filas.length) return 'No había stock inicial que cargar.';
  hoja('movimientos').getRange(2, 1, filas.length, 10).setValues(filas);
  return 'Cargado el stock inicial de ' + filas.length + ' productos ('
       + FECHA_STOCK_INICIAL + ').';
}

/* ================= Formato de las hojas ================= */

// Se ejecuta A MANO cuando se actualiza este código y el cambio toca el
// formato, los desplegables o el ancho de las columnas.
//
// Hace falta porque darFormato() corre una sola vez, la primera: si corriera en
// cada sincronización, pisaría cualquier ancho de columna o color que hubieran
// ajustado a mano. Pero entonces un libro ya armado nunca se entera de un
// desplegable nuevo. Esta función es la puerta para eso, y se aprieta a
// propósito, sabiendo que pisa los retoques manuales de formato.
//
// No toca ni una fila de datos.
function reaplicarFormato() {
  darFormato();
  var texto = 'Formato, desplegables y anchos reaplicados en las cinco hojas de datos '
            + 'y en listas. Los datos no se tocaron.';
  Logger.log(texto);
  return texto;
}

function darFormato() {
  formatoDatos('productos', COLOR.verde, COLOR.verdeSuave);
  formatoDatos('clientes', COLOR.gris, '#efedea');
  formatoDatos('ingresos', COLOR.bordo, COLOR.bordoSuave);
  formatoDatos('egresos', COLOR.tierra, COLOR.tierraSuave);
  formatoDatos('personas', COLOR.gris, '#efedea');
  formatoDatos('horas', COLOR.tierra, COLOR.tierraSuave);
  formatoDatos('movimientos', COLOR.verde, COLOR.verdeSuave);

  var l = hoja('listas');
  l.setTabColor(COLOR.gris);
  l.setFrozenRows(1);
  l.getRange(1, 1, 1, 2).setValues([ENCABEZADOS.listas])
    .setBackground(COLOR.gris).setFontColor(COLOR.blanco).setFontWeight('bold');
  l.setColumnWidth(1, 170);
  l.setColumnWidth(2, 170);
}

// Hasta qué fila llegan el formato, los desplegables y el rayado. Google crea
// las hojas con mil filas; acá se estiran hasta esta cantidad de una vez, para
// no tener que reaplicar el formato cada vez que crecen.
var FILAS_CON_FORMATO = 2000;

// Un getRange que se pasa del tamaño de la hoja NO devuelve un rango recortado:
// tira «those rows are out of bounds» y corta la ejecución ahí mismo. Como la
// hoja de ingresos va a pasar las mil filas dentro del primer año —la planilla
// vieja llevaba unas ochocientas en ocho meses—, la hoja se agranda antes de
// escribir en vez de suponer que entra.
function asegurarFilas(h, cuantas) {
  var faltan = cuantas - h.getMaxRows();
  if (faltan > 0) h.insertRowsAfter(h.getMaxRows(), faltan);
}

function formatoDatos(nombre, fuerte, suave) {
  var h = hoja(nombre);
  var cols = COLUMNAS[nombre];
  var n = cols.length;

  asegurarFilas(h, FILAS_CON_FORMATO);
  h.setTabColor(fuerte);
  h.setFrozenRows(1);
  h.getRange(1, 1, 1, n).setValues([ENCABEZADOS[nombre]])
    .setBackground(fuerte).setFontColor(COLOR.blanco).setFontWeight('bold').setFontSize(11);

  if (h.getBandings().length === 0) {
    h.getRange(1, 1, FILAS_CON_FORMATO, n).applyRowBanding()
      .setHeaderRowColor(fuerte).setFirstRowColor(COLOR.blanco).setSecondRowColor(suave);
  }

  var col = function (c) { return cols.indexOf(c) + 1; };
  if (col('fecha')) {
    h.getRange(2, col('fecha'), FILAS_CON_FORMATO - 1).setNumberFormat('dd/mm/yyyy');
    h.setColumnWidth(col('fecha'), 95);
  }
  ['costo', 'pmayor', 'pminor', 'precio', 'subtotal', 'monto', 'precio_hora'].forEach(function (c) {
    if (col(c)) {
      h.getRange(2, col(c), FILAS_CON_FORMATO - 1).setNumberFormat('"$"#,##0');
      h.setColumnWidth(col(c), 110);
    }
  });
  ['producto', 'detalle', 'obs', 'nombre', 'cliente'].forEach(function (c) {
    if (col(c)) h.setColumnWidth(col(c), 200);
  });

  // Los desplegables se arman contra las hojas "listas", "productos" y
  // "clientes", y admiten valores fuera de la lista: una fila cargada a mano
  // recibe una advertencia, no un rechazo. Si rechazara, dejaría de poder
  // usarse la planilla como planilla.
  var ss = SpreadsheetApp.getActive();
  var contra = function (rango) {
    return SpreadsheetApp.newDataValidation()
      .requireValueInRange(ss.getRange(rango), true).setAllowInvalid(true).build();
  };
  if (col('medio_pago')) {
    h.getRange(2, col('medio_pago'), FILAS_CON_FORMATO - 1).setDataValidation(contra('listas!A2:A200'));
  }
  if (nombre === 'egresos') {
    h.getRange(2, col('rubro'), FILAS_CON_FORMATO - 1).setDataValidation(contra('listas!B2:B200'));
  }
  if (col('persona')) {
    h.getRange(2, col('persona'), FILAS_CON_FORMATO - 1).setDataValidation(contra('personas!A2:A200'));
  }
  if (nombre === 'horas') {
    h.getRange(2, col('actividad'), FILAS_CON_FORMATO - 1).setDataValidation(
      SpreadsheetApp.newDataValidation().requireValueInList(ACTIVIDADES, true)
        .setAllowInvalid(true).build());
  }
  if (col('cod') && nombre !== 'productos') {
    h.getRange(2, col('cod'), FILAS_CON_FORMATO - 1).setDataValidation(contra('productos!A2:A500'));
  }
  if (nombre === 'ingresos') {
    h.getRange(2, col('cliente'), FILAS_CON_FORMATO - 1).setDataValidation(contra('clientes!A2:A500'));
    h.getRange(2, col('lista'), FILAS_CON_FORMATO - 1).setDataValidation(
      SpreadsheetApp.newDataValidation().requireValueInList(['mayorista', 'minorista'], true)
        .setAllowInvalid(true).build());
  }
  // Ojo: "tipo" existe en dos hojas y quiere decir cosas distintas en cada
  // una, así que va por nombre de hoja y no por nombre de columna.
  if (nombre === 'movimientos') {
    h.getRange(2, col('tipo'), FILAS_CON_FORMATO - 1).setDataValidation(
      SpreadsheetApp.newDataValidation().requireValueInList(TIPOS, true)
        .setAllowInvalid(true).build());
  }
  if (nombre === 'clientes') {
    // Sin la lista, cualquier cosa que no empiece con "consig" se lee como
    // "compra". Un cliente de consignación mal tipeado desaparecería de la
    // pantalla de consignaciones sin que nada avise.
    h.getRange(2, col('tipo'), FILAS_CON_FORMATO - 1).setDataValidation(
      SpreadsheetApp.newDataValidation().requireValueInList(['compra', 'consignación'], true)
        .setAllowInvalid(true).build());
  }
  ['activo', 'pagado'].forEach(function (c) {
    if (!col(c)) return;
    h.getRange(2, col(c), FILAS_CON_FORMATO - 1).setDataValidation(
      SpreadsheetApp.newDataValidation().requireValueInList(['sí', 'no'], true)
        .setAllowInvalid(true).build());
  });

  // Columnas técnicas: existen porque la sincronización las necesita, pero no
  // le sirven a nadie que abra la planilla a mirar.
  if (col('id')) { h.getRange(2, col('id'), FILAS_CON_FORMATO - 1).setNumberFormat('@'); h.hideColumns(col('id')); }
  if (col('venta')) { h.getRange(2, col('venta'), FILAS_CON_FORMATO - 1).setNumberFormat('@'); h.hideColumns(col('venta')); }
  if (col('mod')) { h.getRange(2, col('mod'), FILAS_CON_FORMATO - 1).setNumberFormat('0'); h.hideColumns(col('mod')); }
}

/* ==========================================================================
   HOJA RESUMEN

   Es para mirar desde la planilla, no para la app: la app calcula lo suyo.
   Se crea una sola vez; si la tocan o le agregan cosas, no se pisa.

   Las fórmulas usan ";" como separador porque la planilla está en español.
   ========================================================================== */

function crearResumen() {
  var ss = SpreadsheetApp.getActive();
  if (ss.getSheetByName('resumen')) return;
  var h = ss.insertSheet('resumen', 0);
  h.setTabColor(COLOR.bordo);

  h.getRange('A1:H1').merge().setValue('COCINA VIVA · RESUMEN')
    .setBackground(COLOR.bordo).setFontColor(COLOR.blanco)
    .setFontWeight('bold').setFontSize(14).setHorizontalAlignment('center');

  h.getRange('A3:B7').setValues([
    ['Ingresos totales', '=SUM(ingresos!' + letraDe('ingresos', 'subtotal') + '2:'
      + letraDe('ingresos', 'subtotal') + ')'],
    ['Egresos totales', '=SUM(egresos!' + letraDe('egresos', 'monto') + '2:'
      + letraDe('egresos', 'monto') + ')'],
    ['Balance', '=B3-B4'],
    ['Valor del stock en depósito', '=SUM(F11:F70)'],
    ['Valor en consignación', '=SUM(G11:G70)']
  ]);
  h.getRange('A3:A7').setFontWeight('bold');
  h.getRange('B3:B7').setNumberFormat('"$"#,##0');

  h.getRange('A9').setValue('STOCK POR PRODUCTO').setFontWeight('bold').setFontColor(COLOR.verde);
  h.getRange('A10:G10').setValues([['código', 'producto', 'en depósito', 'en la calle',
                                    'precio mayor', 'valor depósito', 'valor en la calle']])
    .setFontWeight('bold').setBackground(COLOR.crema);

  // "En la calle" es todo lo que está en un local: cualquier ubicación que no
  // sea una de las reservadas. Se escribe como una lista de "distinto de" en
  // vez de nombrar los locales uno por uno, así un local nuevo entra solo.
  var noReservada = function (columna) {
    return ';movimientos!$' + columna + '$2:$' + columna + ';"<>"'
         + ';movimientos!$' + columna + '$2:$' + columna + ';"<>' + DEPOSITO + '"'
         + ';movimientos!$' + columna + '$2:$' + columna + ';"<>' + VENDIDO + '"'
         + ';movimientos!$' + columna + '$2:$' + columna + ';"<>' + MERMA + '"'
         + ';movimientos!$' + columna + '$2:$' + columna + ';"<>' + PRODUCCION + '"';
  };

  // Sesenta filas alcanzan de sobra para el catálogo y dejan lugar a los
  // productos nuevos: la fila se completa sola cuando aparece el código.
  var filas = [];
  for (var i = 0; i < 60; i++) {
    var p = i + 2;                       // fila de la hoja productos
    var f = i + 11;                      // fila de esta hoja
    var entra = 'SUMIFS(movimientos!$E$2:$E;movimientos!$D$2:$D;$A' + f + ';movimientos!$G$2:$G;"' + DEPOSITO + '")';
    var sale  = 'SUMIFS(movimientos!$E$2:$E;movimientos!$D$2:$D;$A' + f + ';movimientos!$F$2:$F;"' + DEPOSITO + '")';
    var entraCalle = 'SUMIFS(movimientos!$E$2:$E;movimientos!$D$2:$D;$A' + f + noReservada('G') + ')';
    var saleCalle  = 'SUMIFS(movimientos!$E$2:$E;movimientos!$D$2:$D;$A' + f + noReservada('F') + ')';
    filas.push([
      '=IF(productos!A' + p + '="";"";productos!A' + p + ')',
      '=IF($A' + f + '="";"";productos!B' + p + '&" "&productos!C' + p + ')',
      '=IF($A' + f + '="";"";' + entra + '-' + sale + ')',
      '=IF($A' + f + '="";"";' + entraCalle + '-' + saleCalle + ')',
      '=IF($A' + f + '="";"";productos!' + letraDe('productos', 'pmayor') + p + ')',
      '=IF($A' + f + '="";"";C' + f + '*E' + f + ')',
      '=IF($A' + f + '="";"";D' + f + '*E' + f + ')'
    ]);
  }
  h.getRange(11, 1, 60, 7).setValues(filas);
  h.getRange('C11:D70').setNumberFormat('0');
  h.getRange('E11:G70').setNumberFormat('"$"#,##0');

  h.getRange('A72').setValue('INGRESOS POR MES').setFontWeight('bold').setFontColor(COLOR.bordo);
  h.getRange('D72').setValue('EGRESOS POR RUBRO').setFontWeight('bold').setFontColor(COLOR.tierra);
  ingresosPorMes(h);
  egresosPorRubro(h);
  h.getRange('E73:E200').setNumberFormat('"$"#,##0');

  [1, 2].forEach(function (c) { h.setColumnWidth(c, 190); });
  [3, 4, 5, 6, 7].forEach(function (c) { h.setColumnWidth(c, 120); });
}

/* --------------------------------------------------------------------------
   INGRESOS POR MES

   Acá había un QUERY sobre un arreglo armado a mano —{mes \ subtotal}— que en
   la planilla daba #ERROR!, que es lo que muestra Sheets cuando no entiende la
   fórmula. Se reemplazó por dos piezas que no necesitan armar ningún arreglo:

     - la columna de meses sale de SORT + UNIQUE + FILTER sobre el texto
       "aaaa-mm" de la fecha;
     - cada total es un SUMPRODUCT común y corriente, uno por renglón.

   Es más largo de escribir y mucho más difícil de romper. Los meses se siguen
   comparando como texto y no con funciones de fecha, que era la decisión
   original y sigue siendo la correcta: QUERY resuelve las fechas según el tipo
   que le adivina a la columna.

   Van 36 renglones, tres años de meses. Si alguna vez se quedan cortos, se
   cambia RENGLONES_MES y se vuelve a correr arreglarIngresosPorMes().
   -------------------------------------------------------------------------- */

var RENGLONES_MES = 36;

function ingresosPorMes(h) {
  h.getRange('A73:B73').setValues([['mes', 'ingresos']]).setFontWeight('bold');

  h.getRange('A74').setValue(
    '=IFERROR(SORT(UNIQUE(FILTER(TEXT(ingresos!C2:C2000;"yyyy-mm");'
    + 'ingresos!C2:C2000<>""));1;FALSE);"")');

  var subtotal = letraDe('ingresos', 'subtotal');
  var totales = [];
  for (var i = 0; i < RENGLONES_MES; i++) {
    var f = 74 + i;
    totales.push(['=IFERROR(IF($A' + f + '="";"";SUMPRODUCT('
      + '(TEXT(ingresos!$C$2:$C$2000;"yyyy-mm")=$A' + f + ')'
      + '*ingresos!$' + subtotal + '$2:$' + subtotal + '$2000));"")']);
  }
  h.getRange(74, 2, RENGLONES_MES, 1).setValues(totales);
  h.getRange(74, 2, RENGLONES_MES, 1).setNumberFormat('"$"#,##0');
}

// Los egresos por rubro. El rango y la columna que se suma salen de COLUMNAS,
// no escritos a mano: cada vez que se agregó una columna a la hoja, esta
// fórmula se quedó apuntando al lugar de antes y sumó la columna equivocada
// sin dar error —una vez sumó «cantidad», que es texto, y el resumen dijo $100—.
function egresosPorRubro(h) {
  var rubro = letraDe('egresos', 'rubro');
  var monto = letraDe('egresos', 'monto');
  h.getRange('D73').setValue(
    '=QUERY(egresos!' + rubro + '2:' + monto + ';"select ' + rubro + ', sum(' + monto + ')'
    + ' where ' + rubro + " is not null group by " + rubro
    + ' order by sum(' + monto + ') desc'
    + " label " + rubro + " 'rubro', sum(" + monto + ") 'total'" + '";0)');
}

/* --------------------------------------------------------------------------
   REESCRIBIR TODAS LAS FÓRMULAS DEL RESUMEN

   La hoja resumen apunta a las otras por letra de columna, que es la única
   forma que hay en una planilla. El problema es que la letra se mueve cada vez
   que se agrega una columna, y la fórmula sigue apuntando al lugar de antes:
   no da error, muestra otro número. Ya pasó tres veces —con el costo, con
   «pagado» y con «persona»—.

   Ahora todas las letras salen de COLUMNAS con letraDe(), y esta función las
   reescribe de una. Se llama sola desde la migración, así que agregar una
   columna ya no deja el resumen mintiendo.
   -------------------------------------------------------------------------- */

function arreglarFormulasDelResumen() {
  var h = SpreadsheetApp.getActive().getSheetByName('resumen');
  if (!h) return 'No hay hoja resumen.';

  h.getRange('B3').setValue('=SUM(ingresos!' + letraDe('ingresos', 'subtotal') + '2:'
    + letraDe('ingresos', 'subtotal') + ')');
  h.getRange('B4').setValue('=SUM(egresos!' + letraDe('egresos', 'monto') + '2:'
    + letraDe('egresos', 'monto') + ')');

  arreglarPrecioDelResumen();
  egresosPorRubro(h);
  h.getRange('A73:B200').clearContent();
  ingresosPorMes(h);

  return 'Fórmulas del resumen reescritas contra las columnas de hoy.';
}

// Para arreglar un libro que ya existe: crearResumen() no sirve porque se corta
// sola si la hoja ya está, y borrar la hoja entera para rehacerla es más
// riesgoso que reescribir las cuatro celdas que hacen falta.

  var h = SpreadsheetApp.getActive().getSheetByName('resumen');

/* --------------------------------------------------------------------------
   SACAR DE CONSIGNACIÓN A LOS CLIENTES DADOS DE BAJA

   La consignación vieja se importó desde la planilla anterior, y ahí había
   locales con los que ya no trabajan. Esta función saca la mercadería de los
   que estén marcados como NO activos.

   Toca SOLO los renglones del conteo inicial, los que tienen la referencia
   'conteo inicial'. Una entrega, una liquidación o una devolución de verdad no
   se borran nunca, aunque después den de baja al cliente: eso pasó y tiene que
   quedar anotado. Lo importado es lo único que se puede sacar sin mentir.

   No lleva ningún nombre escrito: mira quién está dado de baja en la hoja de
   clientes. Si mañana dan de baja a otro, se vuelve a correr y listo.
   -------------------------------------------------------------------------- */

function limpiarConsignacionDeBajas() { return conCandado(limpiarConsignacionDeBajasAhora); }

function limpiarConsignacionDeBajasAhora() {
  var deBaja = {};
  leerFilas('clientes').forEach(function (c) {
    if (c.activo === false) deBaja[c.nombre] = true;
  });

  var movimientos = leerFilas('movimientos');
  var sacados = [];
  var quedan = movimientos.filter(function (m) {
    var esImportado = m.tipo === 'ajuste' && String(m.ref).trim() === 'conteo inicial';
    if (esImportado && deBaja[String(m.hacia).trim()]) {
      sacados.push(m);
      return false;
    }
    return true;
  });

  if (!sacados.length) return 'No había consignación de clientes dados de baja.';

  // Las lápidas hacen que la baja también les llegue a los teléfonos que ya se
  // habían bajado esas filas, en vez de depender de que no las vuelvan a subir.
  var borrados = {};
  leerBorrados().forEach(function (b) { borrados[b.id] = b; });
  var ahora = Date.now();
  sacados.forEach(function (m) { borrados[m.id] = { id: m.id, mod: ahora }; });

  escribirFilas('movimientos', quedan);
  escribirBorrados(borrados);

  var porLocal = {};
  sacados.forEach(function (m) {
    porLocal[m.hacia] = (porLocal[m.hacia] || 0) + (Number(m.cantidad) || 0);
  });
  var detalle = Object.keys(porLocal).sort().map(function (n) {
    return '  • ' + n + ': ' + porLocal[n] + ' u.';
  }).join('\n');

  var texto = 'Sacados ' + sacados.length + ' renglones de conteo inicial:\n' + detalle
    + '\nSincronizar desde un teléfono para que lo vean las dos.';
  Logger.log(texto);
  return texto;
}

/* --------------------------------------------------------------------------
   FECHAR LA CONSIGNACIÓN IMPORTADA

   Los 84 renglones que se trajeron de la planilla vieja entraron todos con
   fecha 21/8/2026, el día del conteo del depósito. Como foto es coherente, pero
   deja ciega a la pantalla de antigüedad: los diez locales aparecen con la
   misma edad, cuando en la planilla había entregas de abril y de agosto. Y
   distinguir eso es justamente para lo que sirve esa pantalla.

   La fecha real de cada local quedó escrita en las observaciones —«anotada el
   8/04/2026»—. Esta función la pasa a la columna de fecha, que es donde sirve.

   NO MUEVE STOCK. Estos movimientos tienen el «desde» vacío, así que cambiarles
   la fecha no cambia ningún saldo: solo mueve el reloj.

   Al depósito no lo toca: su conteo sí es del 21/8 y esa fecha es la correcta.
   -------------------------------------------------------------------------- */

function fecharConsignacionImportada() { return conCandado(fecharConsignacionImportadaAhora); }

function fecharConsignacionImportadaAhora() {
  var movimientos = leerFilas('movimientos');
  var tocados = 0;

  movimientos.forEach(function (m) {
    if (m.tipo !== 'ajuste' || String(m.ref).trim() !== 'conteo inicial') return;
    var local = String(m.hacia || '').trim();
    if (!local || local === DEPOSITO) return;

    // El año es opcional porque en la planilla había fechas escritas «7/8».
    var d = String(m.obs || '').match(/anotada el\s+(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{4}))?/);
    if (!d) return;

    var iso = (d[3] || '2026') + '-' + dos(d[2]) + '-' + dos(d[1]);
    if (m.fecha === iso) return;
    m.fecha = iso;
    m.mod = Date.now();
    tocados++;
  });

  if (!tocados) return 'No había fechas que corregir.';
  escribirFilas('movimientos', movimientos);
  var texto = 'Corregidas ' + tocados + ' fechas de la consignación importada.\n'
    + 'Sincronizar desde un teléfono para que lo vean las dos.';
  Logger.log(texto);
  return texto;
}

/* --------------------------------------------------------------------------
   RENOMBRAR CÓDIGOS DE PRODUCTO EN TODA LA HISTORIA

   El código de un producto se decidió que no se edita, justamente porque lo
   guardan todas las ventas y todos los movimientos. Pero a veces hay que
   cambiarlo igual: el catálogo se cargó con los gramajes de la planilla vieja y
   algunos estaban mal. Cambiar el código en la hoja de productos y nada más
   deja la historia huérfana: el stock se queda pegado al código que ya no
   existe, y el producto nuevo arranca en cero.

   Esta función reescribe el código en «ingresos» y en «movimientos», que es
   donde vive la historia. No toca la hoja de productos: eso ya se hizo a mano.

   Es idempotente: la segunda vez no encuentra nada porque los viejos ya no
   están. Y no hace nada si el código nuevo no existe en el catálogo, para que
   un error de tipeo en el mapa no invente un producto fantasma.
   -------------------------------------------------------------------------- */

var CODIGOS_RENOMBRADOS = {
  'CHCIR350': 'CHCIR360',
  'CHDU350':  'CHDU360',
  'CRT600':   'CRT650',
  'KIM600':   'KIM650',
  'KIM340':   'KIM350',
  'PIK360':   'PIK350'
};

function renombrarCodigos() { return conCandado(renombrarCodigosAhora); }

function renombrarCodigosAhora() {
  var productos = leerFilas('productos');
  var catalogo = {};
  productos.forEach(function (p) { catalogo[p.cod] = true; });

  // De cada par tiene que existir al menos una punta. Si no existe ninguna, es
  // un error de tipeo en el mapa, y renombrar inventaría un producto fantasma
  // en vez de arreglar el viejo.
  var perdidos = [];
  Object.keys(CODIGOS_RENOMBRADOS).forEach(function (viejo) {
    if (!catalogo[viejo] && !catalogo[CODIGOS_RENOMBRADOS[viejo]]) {
      perdidos.push(viejo + ' → ' + CODIGOS_RENOMBRADOS[viejo]);
    }
  });
  if (perdidos.length) {
    return 'No se tocó nada: de estos pares no existe ninguna de las dos puntas '
         + 'en el catálogo — ' + perdidos.join('; ') + '.';
  }

  var ahora = Date.now();
  var cuenta = {};
  var tocadas = 0;

  // Primero el catálogo, si el código viejo todavía está ahí. Al revés, la
  // historia quedaría apuntando a un producto que aún no existe.
  var enCatalogo = 0;
  productos.forEach(function (p) {
    var nuevo = CODIGOS_RENOMBRADOS[p.cod];
    if (!nuevo || catalogo[nuevo]) return;      // ya renombrado a mano: no se duplica
    p.cod = nuevo;
    p.mod = ahora;
    enCatalogo++;
  });
  if (enCatalogo) escribirFilas('productos', productos);

  ['ingresos', 'movimientos'].forEach(function (nombre) {
    var filas = leerFilas(nombre);
    var cambio = false;
    filas.forEach(function (f) {
      var nuevo = CODIGOS_RENOMBRADOS[f.cod];
      if (!nuevo) return;
      cuenta[f.cod + ' → ' + nuevo] = (cuenta[f.cod + ' → ' + nuevo] || 0) + 1;
      f.cod = nuevo;
      f.mod = ahora;              // para que le gane a la copia de los teléfonos
      cambio = true;
      tocadas++;
    });
    if (cambio) escribirFilas(nombre, filas);
  });

  if (!tocadas && !enCatalogo) return 'No había ningún código viejo que renombrar.';

  var detalle = Object.keys(cuenta).sort().map(function (k) {
    return '  • ' + k + ': ' + cuenta[k] + ' filas';
  }).join('\n');
  var texto = 'Renombrados ' + enCatalogo + ' productos del catálogo y '
    + tocadas + ' filas de la historia.\n' + detalle
    + '\nSincronizar desde un teléfono para que lo vean las dos.';
  Logger.log(texto);
  return texto;
}

/* --------------------------------------------------------------------------
   EL CANDADO DE LAS FUNCIONES DE MANTENIMIENTO

   Las funciones que se corren a mano desde el editor leen una hoja entera, la
   modifican y la vuelven a escribir. Si un teléfono sincroniza justo en el
   medio, uno de los dos pisa al otro y se pierde lo que el otro escribió.

   doPost ya toma este mismo candado, así que con esto la sincronización espera
   su turno en vez de atropellar. Y al revés: si hay una sincronización en curso,
   la función espera a que termine.

   Las migraciones NO pasan por acá: corren dentro de asegurarEsquema(), que ya
   está adentro del candado de doPost.
   -------------------------------------------------------------------------- */

function conCandado(tarea) {
  var candado = LockService.getScriptLock();
  try {
    candado.waitLock(30000);
  } catch (err) {
    return 'No se pudo hacer: hay una sincronización en curso y no soltó el paso '
         + 'en 30 segundos. Probá de nuevo en un minuto. No se tocó nada.';
  }
  try {
    return tarea();
  } finally {
    candado.releaseLock();
  }
}

/* --------------------------------------------------------------------------
   EL RESPALDO DE TODAS LAS NOCHES

   La planilla es la única copia de verdad. Los teléfonos no son un respaldo:
   cada sincronización les reemplaza lo que tienen por lo que dice la planilla,
   así que una fila borrada en la planilla desaparece de los dos teléfonos en la
   sincronización siguiente. Y solo suben lo que cambió desde la última vez, de
   modo que tampoco pueden devolver lo que no tocaron.

   El 7 de septiembre la columna de fechas de «ingresos» apareció vacía y las
   fechas verdaderas se recuperaron de copias sueltas que existían de casualidad.
   Que no vuelva a depender de la casualidad.

   Deja una copia por día en una carpeta al lado del libro y guarda las últimas
   treinta. Son unos pocos kilobytes cada una.

   Cómo se enciende: correr una sola vez activarRespaldoDiario() desde el editor.
   La primera vez Google va a pedir permiso para tocar el Drive; es para poder
   copiar el archivo, y hay que dárselo.
   -------------------------------------------------------------------------- */

var CARPETA_RESPALDOS = 'Cocina Viva · respaldos';
var RESPALDOS_QUE_SE_GUARDAN = 30;

function activarRespaldoDiario() {
  ScriptApp.getProjectTriggers().forEach(function (t) {
    if (t.getHandlerFunction() === 'respaldoDiario') ScriptApp.deleteTrigger(t);
  });
  ScriptApp.newTrigger('respaldoDiario').timeBased().atHour(3).everyDays(1).create();
  var texto = 'Respaldo diario activado: todas las noches, alrededor de las 3, '
    + 'queda una copia del libro en la carpeta «' + CARPETA_RESPALDOS + '». '
    + 'Se guardan las últimas ' + RESPALDOS_QUE_SE_GUARDAN + '.';
  Logger.log(texto);
  return texto;
}

function desactivarRespaldoDiario() {
  var cuantos = 0;
  ScriptApp.getProjectTriggers().forEach(function (t) {
    if (t.getHandlerFunction() === 'respaldoDiario') { ScriptApp.deleteTrigger(t); cuantos++; }
  });
  return cuantos ? 'Respaldo diario apagado.' : 'No estaba encendido.';
}

// La carpeta va al lado del libro, no en la raíz del Drive: si alguien mueve el
// libro de lugar, los respaldos se mudan con él.
function carpetaDeRespaldos(archivo) {
  var padres = archivo.getParents();
  var donde = padres.hasNext() ? padres.next() : DriveApp.getRootFolder();
  var hay = donde.getFoldersByName(CARPETA_RESPALDOS);
  return hay.hasNext() ? hay.next() : donde.createFolder(CARPETA_RESPALDOS);
}

function respaldoDiario() {
  var libro = SpreadsheetApp.getActive();
  var archivo = DriveApp.getFileById(libro.getId());
  var carpeta = carpetaDeRespaldos(archivo);

  var cuando = Utilities.formatDate(new Date(), Session.getScriptTimeZone(), 'yyyy-MM-dd');
  var nombre = 'Cocina Viva ' + cuando;

  // Si ya hay una copia de hoy —porque se corrió a mano— no se hace otra.
  if (carpeta.getFilesByName(nombre).hasNext()) {
    return 'Ya había un respaldo de hoy. No se hizo otro.';
  }
  archivo.makeCopy(nombre, carpeta);

  // Y se tiran los más viejos, para que la carpeta no crezca sin fin.
  var copias = [];
  var lista = carpeta.getFiles();
  while (lista.hasNext()) {
    var f = lista.next();
    copias.push({ archivo: f, cuando: f.getDateCreated().getTime() });
  }
  copias.sort(function (a, b) { return b.cuando - a.cuando; });
  var tirados = 0;
  copias.slice(RESPALDOS_QUE_SE_GUARDAN).forEach(function (c) {
    c.archivo.setTrashed(true);
    tirados++;
  });

  var texto = 'Respaldo guardado: ' + nombre + '. Quedan '
    + Math.min(copias.length, RESPALDOS_QUE_SE_GUARDAN) + ' copias'
    + (tirados ? ' (se tiraron ' + tirados + ' viejas).' : '.');
  Logger.log(texto);
  return texto;
}

/* ================= Auxiliares ================= */

// La letra de una columna, calculada desde COLUMNAS. Escribir la letra a mano
// dentro de una fórmula es una bomba de tiempo: el día que se agrega una columna
// la fórmula sigue apuntando al lugar de antes, no da error, y muestra el dato
// equivocado sin que nadie se entere. Que pasó exactamente eso con el costo.
function letraDe(nombre, campo) {
  var i = COLUMNAS[nombre].indexOf(campo);
  if (i < 0) throw new Error('No existe la columna ' + campo + ' en ' + nombre);
  return String.fromCharCode(65 + i);      // ninguna hoja llega a la Z
}

function hoja(nombre) {
