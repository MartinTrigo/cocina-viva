<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8c0730">
  <title>Cocina Viva</title>
  <meta name="description" content="Gestión de ventas, gastos, consignaciones y stock de Cocina Viva. Fermentos y conservas de la Comarca Andina del Paralelo 42.">

  <!-- La app no carga nada de afuera: ni tipografías, ni librerías, ni imágenes
       de otros sitios. Eso permite declarar de dónde puede venir cada cosa y
       que el navegador rechace todo lo demás. Si alguna vez se colara un script
       ajeno, no llega a ejecutarse. Lo único externo permitido es el servicio de
       la planilla de Google, que es a donde se sincronizan los datos.

       El blob: en img-src es para los remitos: se dibujan en un canvas y se
       muestran antes de compartirlos, sin salir del teléfono. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    style-src 'self';
    img-src 'self' data: blob:;
    manifest-src 'self';
    connect-src 'self' https://script.google.com https://script.googleusercontent.com;
    base-uri 'none';
    form-action 'none';
    object-src 'none'">

  <!-- Al abrir un enlace externo no se le cuenta de dónde salió. -->
  <meta name="referrer" content="no-referrer">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/icono-192.png">
  <link rel="apple-touch-icon" href="img/icono-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <header class="cabecera">
    <div class="barra">
      <button class="volver" id="btn-volver" hidden aria-label="Volver">&#8592;</button>
      <img class="marca" src="img/logotipo.svg" alt="Cocina Viva" id="marca">
      <div class="barra__texto">
        <h1 id="titulo-vista">Cocina Viva</h1>
        <p id="subtitulo-vista">Gesti&oacute;n del emprendimiento</p>
      </div>
      <button class="sincro" id="btn-sincro" aria-label="Sincronizar con la planilla">&#8635;</button>
    </div>
  </header>

  <main id="vista" class="vista">
    <p class="cargando">Cargando&hellip;</p>
  </main>

  <footer class="pie">
    <p><strong>Cocina Viva</strong></p>
    <p>Fermentos y conservas &middot; Comarca Andina del Paralelo 42</p>
    <p class="pie__version" id="pie-version"></p>
  </footer>

  <noscript>
    <p class="aviso aviso--error">Esta aplicación necesita JavaScript activado para funcionar.</p>
  </noscript>

  <script src="js/util.js"></script>
  <script src="js/acceso.js"></script>
  <script src="js/db.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/sincro.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
